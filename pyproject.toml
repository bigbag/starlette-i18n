[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "starlette-i18n"
version = "3.0.0"
description = "Request-safe gettext localization and locale negotiation for Starlette"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pavel Liashkov", email = "pavel.liashkov@protonmail.com" }]
keywords = ["asgi", "babel", "gettext", "i18n", "starlette"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "babel>=2.13,<3.0",
  "starlette>1.2.0,<2.0.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.7.0",
  "jinja2>=3.1",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.urls]
Changelog = "https://github.com/bigbag/starlette-i18n/blob/main/CHANGELOG.md"
Homepage = "https://github.com/bigbag/starlette-i18n"
Issues = "https://github.com/bigbag/starlette-i18n/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/starlette_i18n"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-config"

[tool.coverage.run]
source = ["starlette_i18n"]
branch = true
